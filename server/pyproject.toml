[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrphoto"
version = "0.1.0"
description = "Local SHARP photo library and PlayCanvas WebXR viewer"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "Pillow>=10,<12", "cryptography>=43,<47", "PyYAML>=6,<7"]

[project.scripts]
vrphoto = "vrphoto.cli:main"

[tool.setuptools.package-data]
vrphoto = ["static/*"]

